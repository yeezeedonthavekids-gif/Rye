<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="rye.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="composition">
        <p class="time" id="time" hidden></p>
        <header class="hello" id="hello" hidden>
          <h1 class="hello-line" id="hello-line"></h1>
        </header>

        <form class="search" id="search" role="search">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 4.5 4.5" /></svg>
          <input id="q" name="q" autocomplete="off" spellcheck="false" aria-label="Search or enter an address" />
          <span class="search-engine" id="search-engine"></span>
        </form>

        <label class="note" id="note" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
          <input id="note-input" maxlength="140" placeholder="A note for today" aria-label="Note for today" />
        </label>

        <nav class="groups" id="groups" aria-label="Shortcut collections" hidden></nav>
        <section class="shortcuts" id="shortcuts" aria-label="Shortcuts"></section>

        <section class="lists" id="lists" hidden>
          <div class="list" id="list-bookmarks" hidden><h2>Bookmarks</h2><ul></ul></div>
          <div class="list" id="list-recent" hidden><h2>Recently visited</h2><ul></ul></div>
          <div class="list" id="list-frequent" hidden><h2>Most visited</h2><ul></ul></div>
        </section>
      </div>
    </main>

    <footer class="corner-actions" id="corner-actions">
      <button class="chip-btn" id="profile-btn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="profile-avatar"></span><span id="profile-label"></span>
      </button>
      <div class="menu" id="profile-menu" role="menu" hidden></div>
      <span class="spacer"></span>
      <button class="chip-btn" id="customize" type="button" aria-expanded="false" aria-controls="panel">Customize</button>
    </footer>

    <aside class="panel" id="panel" hidden aria-label="Customize">
      <div class="panel-head">
        <h2>Customize</h2>
        <button class="icon-btn" id="panel-close" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="panel-body" id="panel-body"></div>
      <a class="panel-more" href="personalize.html">All personalization settings<span aria-hidden="true">→</span></a>
    </aside>

    <div class="scrim" id="editor" hidden>
      <form class="dialog" id="editor-form" aria-labelledby="editor-title">
        <div class="dialog-head">
          <h2 id="editor-title">Add shortcut</h2>
          <button class="icon-btn" id="editor-close" type="button" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="editor-grid">
          <div class="editor-icon">
            <button type="button" class="editor-icon-btn" id="ed-icon-btn" aria-label="Choose an icon image"><span class="tile-icon" id="ed-icon-preview"></span></button>
            <button type="button" class="link-btn" id="ed-icon-reset">Use site icon</button>
            <input type="file" id="ed-icon-file" accept="image/*" hidden />
          </div>
          <div class="editor-fields">
            <label><span class="label">Address</span><input class="field" id="ed-url" placeholder="example.com" required /></label>
            <label><span class="label">Name</span><input class="field" id="ed-title" placeholder="Optional" maxlength="60" /></label>
            <div class="editor-split">
              <label><span class="label">Collection</span><select class="field" id="ed-group"></select></label>
              <div><span class="label">Color</span><div class="ed-colors" id="ed-colors"></div></div>
            </div>
          </div>
        </div>
        <p class="form-error" id="ed-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="btn ghost danger" id="ed-remove" type="button">Remove</button>
          <span class="spacer"></span>
          <button class="btn ghost" id="ed-cancel" type="button">Cancel</button>
          <button class="btn primary" type="submit">Save</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <!-- First-launch setup -->
    <div class="onboarding" id="onboarding" hidden>
      <div class="ob-card" id="ob-card" role="dialog" aria-modal="true" aria-labelledby="ob-title">
        <ol class="ob-progress" id="ob-progress" aria-label="Setup progress"></ol>
        <div class="ob-steps" id="ob-steps"></div>
        <div class="ob-foot" id="ob-foot"></div>
      </div>
    </div>

    <input type="file" id="bg-file" accept="image/*" hidden />
    <script src="core.js"></script>
    <script src="newtab.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
